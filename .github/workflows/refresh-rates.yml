name: Refresh AfricaStay widget rates

# Runs nightly at 02:30 UTC, in two steps:
#
#   calendar_prices.py --all      prices every card from its own hotel page
#   destination_tile_prices.py    cheapest card per destination, for the tiles
#
# This replaced a three-step version that began with rate_fetcher_v2.py, a
# destination search taking about 50 minutes. That search never returned some
# hotels at all, and it depended on price_map.csv, a mapping file that kept
# being rebuilt and losing its hotel ids. Reading each hotel's own page needs
# no mapping, no destination codes and no name matching, and it runs in a few
# minutes.
#
# Files the repo must hold:
#   calendar_prices.py  destination_tile_prices.py  card_urls.csv  rates.json
#
# card_urls.csv is the important one: it maps each card's slug to its hotel
# page. If it holds an old URL, this job will keep publishing a price under a
# key no card uses, and that card will show nothing.
on:
  schedule:
    - cron: "30 2 * * *"
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests

      - name: Price every card from its own hotel page
        run: python calendar_prices.py --all

      - name: Set the destination tile prices
        run: python destination_tile_prices.py

      - name: Check the output before publishing it
        run: |
          python - <<'EOF'
          import json, sys
          d = json.load(open("rates.json"))
          r = d.get("rates", {})
          tiles = {k: v for k, v in r.items() if v.get("is_destination_tile")}
          cards = {k: v for k, v in r.items() if not v.get("is_destination_tile")}
          if len(cards) < 60:
              sys.exit(f"Only {len(cards)} card prices; expected around 105. "
                       "Not publishing a partial run.")
          if len(tiles) < 5:
              sys.exit(f"Only {len(tiles)} destination tiles; expected 6.")
          bad = [k for k, v in r.items() if not (200 <= v["price"] <= 25000)]
          if bad:
              sys.exit(f"Prices out of range: {bad}")
          print(f"{len(cards)} cards, {len(tiles)} tiles, generated {d['generated_utc']}")
          EOF

      - name: Commit if anything changed
        run: |
          git config user.name "africastay-rates-bot"
          git config user.email "actions@github.com"
          git add rates.json
          git diff --staged --quiet && echo "no change" && exit 0
          git commit -m "Refresh rates $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push

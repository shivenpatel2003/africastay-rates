name: Refresh AfricaStay widget rates

# Runs nightly at 02:30 UTC. Three steps, in order:
#
#   rate_fetcher_v2.py          destination searches, prices most cards.
#                               Needs price_map.csv with valid engine_id values.
#   calendar_prices.py          reads the remaining hotels' own page calendars,
#                               because a destination search never returns them.
#                               Needs card_urls.csv.
#   destination_tile_prices.py  cheapest card per destination, for the tiles.
#
# Files the repo must hold:
#   rate_fetcher_v2.py  price_map.csv
#   calendar_prices.py  card_urls.csv
#   destination_tile_prices.py
#   rates.json
#
# The run that failed did so because price_map.csv had been rebuilt against a
# single destination, leaving almost every row without an engine_id, so the
# search priced one card. The check at the end caught it and published nothing.
on:
  schedule:
    - cron: "30 2 * * *"
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 150

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests

      - name: Check the mapping before spending an hour on it
        run: |
          python - <<'EOF'
          import csv, sys
          rows = [r for r in csv.DictReader(open("price_map.csv", encoding="utf-8-sig"))
                  if r.get("Confirmed (Y/N)", "").strip().upper() == "Y"]
          with_id = [r for r in rows if r.get("engine_id", "").strip()]
          print(f"{len(rows)} confirmed rows, {len(with_id)} with an engine_id")
          if len(with_id) < 20:
              sys.exit("price_map.csv has lost its engine_id values. Rebuild it "
                       "with --build-map and apply_decisions.py before running.")
          EOF

      - name: Search prices per destination
        run: python rate_fetcher_v2.py

      - name: Price the hotels the search cannot reach
        run: python calendar_prices.py

      - name: Set the destination tile prices
        run: python destination_tile_prices.py

      - name: Check the output before publishing it
        run: |
          python - <<'EOF'
          import json, sys
          d = json.load(open("rates.json"))
          r = d.get("rates", {})
          tiles = {k: v for k, v in r.items() if v.get("is_destination_tile")}
          cards = {k: v for k, v in r.items() if not v.get("is_destination_tile")}
          if len(cards) < 25:
              sys.exit(f"Only {len(cards)} card prices; expected around 40. "
                       "Not publishing a partial run.")
          if len(tiles) < 5:
              sys.exit(f"Only {len(tiles)} destination tiles; expected 6.")
          bad = [k for k, v in r.items() if not (200 <= v["price"] <= 25000)]
          if bad:
              sys.exit(f"Prices out of range: {bad}")
          print(f"{len(cards)} cards, {len(tiles)} tiles, generated {d['generated_utc']}")
          EOF

      - name: Commit if anything changed
        run: |
          git config user.name "africastay-rates-bot"
          git config user.email "actions@github.com"
          git add rates.json
          git diff --staged --quiet && echo "no change" && exit 0
          git commit -m "Refresh rates $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
